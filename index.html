<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration System</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!----  HEADER SECTION ------>   

<header>
<h1>🎓 Student Registration System</h1>
<p>This system allows students to register their details view records, edit information, and delete entries easily.</p>
</header>


<section class="main-container">

<!-- FORM SECTION -->

<div class="form-card">

<h2>Add Student</h2>


<input type="text" id="name" placeholder="Student Name">
<input type="text" id="sid" placeholder="Student ID">
<input type="text" id="class" placeholder="Class">
<input type="email" id="email" placeholder="Email">
<input type="text" id="contact" placeholder="Contact Number">
<input type="text" id="address" placeholder="Student Address">

<button onclick="addStudent()">Add Student</button>



</div>


<!-- TABLE SECTION -->
<div class="table-card">

<h2>Registered Students</h2>

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Name</th>
<th>ID</th>
<th>Class</th>
<th>Email</th>
<th>Contact</th>
<th>Address</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>

</table>

</div>
</div>

</section>

<!--- FOOTER SECTION ---->

<footer>
<p>Student Registration System © 2026</p>
</footer>

<script src="index.js"></script>

</body>
</html>
